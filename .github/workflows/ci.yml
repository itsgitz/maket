name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref. A newer push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Go build embeds the dashboard, so it must exist before go vet/test/build.
      - name: Build dashboard
        run: bun run build:web

      - name: Check formatting
        run: |
          cd apps/api
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: cd apps/api && go vet ./...

      - name: Test
        run: cd apps/api && go test -race ./...

      - name: Build
        run: cd apps/api && go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run --filter @maket/web check

      - name: Build dashboard
        run: bun run build:web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # shellcheck is preinstalled on the ubuntu-24.04 runner image (0.9.0).
      - name: shellcheck
        run: shellcheck install.sh deploy/backup.sh deploy/setup/*.sh

      # Pinned release binary, verified against the release checksums.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          ./actionlint

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Builds only. Nothing is pushed.
      - name: Build container image
        run: docker build -f deploy/Containerfile -t maket:ci .

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cross-compile CLI
        run: bun run build:cli
