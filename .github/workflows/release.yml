name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/api/go.mod

      - uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: cd apps/api && go test ./...

      - name: Build CLI binaries
        env:
          MAKET_VERSION: ${{ github.ref_name }}
        run: bun run build:cli

      - name: Write checksums
        run: cd bin && sha256sum maket-* > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/maket-* bin/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
